# Relaying an http-only station through HAProxy
#
# Some stations have no https at all — SLAY Radio is one — and a browser will
# not load http audio on an https page. There is no client-side fix; the stream
# has to be re-served over TLS from an origin the browser already trusts.
#
# HAProxy is used here rather than OpenCloud's own proxy because these streams
# sit at the SERVER ROOT (http://relay4.slayradio.org:8000/). OpenCloud's route
# config appends the request path to the backend and cannot rewrite it, so a
# root-mounted stream cannot be expressed there. HAProxy can rewrite paths.
#
# THEN TELL THE APP. Its `relays` key maps each stream's own address to the
# path it is relayed under; stations keep their own addresses and are played
# from here. This file's relays, written out for it:
#
#     node source/scripts/relays-from-haproxy.mjs deploy/haproxy-relay.cfg
#
#     "relays": { "http://relay4.slayradio.org:8000/": "/radio-relay/slay4",
#                 "http://relay3.slayradio.org:8000/": "/radio-relay/slay3" }
#
# WHAT WORKS AND WHAT DOES NOT. HAProxy in `mode http` relays any origin that
# answers with an HTTP/1.x status line. Icecast does. SHOUTcast v1 does not:
# it answers players with "ICY 200 OK", which HAProxy rejects (502, flags PH),
# and it answers a browser User-Agent with its HTML status page instead of the
# stream. Neither can be fixed in HAProxy. Check an origin before relaying it:
#
#     curl -s -m 5 -D - -o /dev/null -A "Mozilla/5.0" http://host:port/ | head -3
#
# You want "HTTP/1.0 200 OK" and "Content-Type: audio/…". An "ICY 200 OK", or
# a "text/html", means a SHOUTcast v1 origin; pick another relay of the same
# station, or run Icecast of your own in relay mode (INSTALL.md §2b).
#
# SLAY Radio, as of 20 September 2026, verified against the live relays:
#     relay1.slayradio.org   SHOUTcast 1.9.8 — cannot be relayed this way
#     relay2.slayradio.org   no longer resolves
#     relay3.slayradio.org   Icecast 2.4.4   — relays cleanly
#     relay4.slayradio.org   Icecast 2.4.4   — relays cleanly
# The station's own playlist labels them: "relay1 [shoutcast]", "relay4
# [icecast]". Use the Icecast ones. Both are exposed below so the app's
# failover has somewhere to go when one is down.

#
# SECURITY: READ BEFORE USING. A relay path answers with whatever a third party
# sends over plain http, and it answers from an address users trust. Served
# from the cloud's OWN hostname and left as is, that is a hole: the response
# does not pass through OpenCloud's proxy, so it carries none of its Content
# Security Policy, and an origin (or anyone on the http hop to it) that answers
# with text/html gets a page that runs in the OpenCloud origin, with the
# visitor's session. The request also carries the visitor's cookies upstream in
# cleartext unless they are removed, and the address of the page they are on.
#
# PREFERRED: give the relay a hostname of its own (radio-relay.example.org),
# with its own certificate, and use the same backends there. Nothing a relay
# returns can then touch the cloud. `media-src https:` already allows it. The
# stream is cross-origin in that case, so the spectrum and track titles need
# the relay to say the cloud may read it (the commented CORS lines below).
#
# IF IT MUST BE THE CLOUD'S HOSTNAME, keep every guard line in the backends
# below. They close the holes that are known: GET and HEAD only, no cookies or
# credentials forwarded, nothing but a plain 200 audio answer let through, no
# cookies set, none of the response headers that act on the whole origin, and
# a sandboxing policy on the response in case anything else ever gets by. That
# is a list of what has been thought of. A hostname of its own is the only
# complete answer, because it needs no list.
#
# ONE KNOWN GAP the guard cannot close: an interim answer (`103 Early Hints`,
# sent before the real one) is passed on by HAProxy 2.4 and 3.0 as it came,
# headers and all, because `http-response` rules see only the final answer.
# Browsers today act only on the `Link` header of a 103, and only when the
# relay address itself is opened in a tab; but it is the origin's say, on your
# hostname. deploy/relay-test reports it, so a HAProxy that closes it shows.
#
# Either way the path is unauthenticated (an <audio> element cannot send a
# token), so anyone who knows it can listen through your server. The backend
# is fixed, so it is not an open proxy, but it is your bandwidth.

frontend cloud
    # … your existing config …
    use_backend radio_slay4 if { path /radio-relay/slay4 }
    use_backend radio_slay3 if { path /radio-relay/slay3 }

# One backend per relay, so the app can fail over between them. The guard
# lines are repeated in each: older HAProxy releases (2.4, for one) do not
# accept them in a shared `defaults` section.
backend radio_slay4
    # Strip the local prefix: the stream lives at "/" on the origin.
    http-request set-path /
    # ONLY ON A RELAY HOSTNAME OF ITS OWN, for the spectrum and track titles
    # (under the cloud's own hostname neither needs anything). Reading titles
    # sends a request header, so the browser first asks with an OPTIONS
    # request whether it may; this answers yes to your cloud, and to nobody
    # else, before the line below refuses everything that is not a GET.
    # Uncomment it with the two at the end of this backend, your cloud's
    # address in all three places (twice on this line) — and the same three in
    # every other relay backend, or a failover to one without them loses the
    # spectrum and titles.
    # http-request return status 204 hdr Access-Control-Allow-Origin "https://cloud.example.org" hdr Access-Control-Allow-Methods "GET" hdr Access-Control-Allow-Headers "Icy-MetaData" hdr Access-Control-Max-Age "600" hdr Vary "Origin" if METH_OPTIONS { req.hdr(origin) -m str https://cloud.example.org }
    # Listening is a GET (METH_GET also matches HEAD, which `curl -I` uses).
    # Nothing else has any business here.
    http-request deny unless METH_GET
    # The visitor's session belongs to the cloud, not to a radio station.
    http-request del-header Cookie
    http-request del-header Authorization
    http-request del-header Referer
    # Nor who is listening, or from which cloud: the station is asked for its
    # own stream by its own name. (`option forwardfor` in the FRONTEND adds
    # the listener's address after these lines run, so it cannot be removed
    # here: put that option in the cloud's own backend instead.) The headers
    # removed are HAProxy's own and those common proxies and CDNs add; a front
    # end that adds another needs it removed here too.
    http-request set-header Host relay4.slayradio.org:8000
    http-request del-header X-Forwarded-For
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Server
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Ssl
    http-request del-header Via
    http-request del-header True-Client-IP
    http-request del-header CF-Connecting-IP
    http-request del-header X-Client-IP
    http-request del-header X-Cluster-Client-IP
    http-request del-header Client-IP
    http-request del-header Fastly-Client-IP
    http-request del-header X-Original-Forwarded-For
    http-request del-header Origin
    # Audio or nothing. An HTML answer (SHOUTcast's status page, an error page,
    # anything injected on the way) is refused rather than served. The whole
    # value is matched: "audio/x text/html" begins like audio and is not.
    http-response deny unless { res.hdr(content-type) -m reg -i ^(audio/[a-z0-9.+-]+|application/ogg)[[:space:]]*(;.*)?$ }
    # Exactly one Content-Type: with two, a browser believes the last, and the
    # line above is satisfied by either.
    http-response deny unless { res.hdr_cnt(content-type) eq 1 }
    # A stream is a 200. A redirect with an audio type would be an open redirect.
    http-response deny unless { status 200 }
    http-response del-header Set-Cookie
    # Headers a browser applies to the whole hostname, not to this one answer:
    # they could log everyone out, undo HSTS, or send reports about the cloud.
    http-response del-header Clear-Site-Data
    http-response del-header Strict-Transport-Security
    http-response del-header NEL
    http-response del-header Report-To
    http-response del-header Reporting-Endpoints
    http-response del-header Refresh
    http-response del-header Alt-Svc
    http-response del-header Link
    http-response del-header Accept-CH
    http-response del-header Set-Login
    # The origin's own CORS answer is not the cloud's to give (the optional
    # lines at the end set the relay's, on a hostname of its own).
    http-response del-header Access-Control-Allow-Origin
    http-response del-header Access-Control-Allow-Credentials
    http-response del-header Access-Control-Expose-Headers
    # A live stream is never to be kept, and a year's `max-age` from the origin
    # would hold whatever it sent in any cache in front of the relay.
    http-response set-header Cache-Control no-store
    http-response set-header X-Content-Type-Options nosniff
    # If anything but audio ever gets by, it runs nothing and loads nothing. The
    # one thing let through is media from this address itself, so the relay
    # path opened directly in a browser tab can still play.
    http-response set-header Content-Security-Policy "sandbox; default-src 'none'; media-src 'self'"
    # The other half of the OPTIONS line above, on a relay hostname of its own
    # only: the cloud may read the answer (the spectrum), and the spacing of
    # the titles in it (track titles).
    # http-response set-header Access-Control-Allow-Origin "https://cloud.example.org"
    # http-response set-header Access-Control-Expose-Headers "icy-metaint"
    server slay4 relay4.slayradio.org:8000

backend radio_slay3
    http-request set-path /
    # The same guard as above, every line of it.
    # The optional CORS lines, as in radio_slay4 (a relay hostname of its own only):
    # http-request return status 204 hdr Access-Control-Allow-Origin "https://cloud.example.org" hdr Access-Control-Allow-Methods "GET" hdr Access-Control-Allow-Headers "Icy-MetaData" hdr Access-Control-Max-Age "600" hdr Vary "Origin" if METH_OPTIONS { req.hdr(origin) -m str https://cloud.example.org }
    http-request deny unless METH_GET
    http-request del-header Cookie
    http-request del-header Authorization
    http-request del-header Referer
    http-request set-header Host relay3.slayradio.org:8000
    http-request del-header X-Forwarded-For
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Server
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Ssl
    http-request del-header Via
    http-request del-header True-Client-IP
    http-request del-header CF-Connecting-IP
    http-request del-header X-Client-IP
    http-request del-header X-Cluster-Client-IP
    http-request del-header Client-IP
    http-request del-header Fastly-Client-IP
    http-request del-header X-Original-Forwarded-For
    http-request del-header Origin
    http-response deny unless { res.hdr(content-type) -m reg -i ^(audio/[a-z0-9.+-]+|application/ogg)[[:space:]]*(;.*)?$ }
    http-response deny unless { res.hdr_cnt(content-type) eq 1 }
    http-response deny unless { status 200 }
    http-response del-header Set-Cookie
    http-response del-header Clear-Site-Data
    http-response del-header Strict-Transport-Security
    http-response del-header NEL
    http-response del-header Report-To
    http-response del-header Reporting-Endpoints
    http-response del-header Refresh
    http-response del-header Alt-Svc
    http-response del-header Link
    http-response del-header Accept-CH
    http-response del-header Set-Login
    http-response del-header Access-Control-Allow-Origin
    http-response del-header Access-Control-Allow-Credentials
    http-response del-header Access-Control-Expose-Headers
    http-response set-header Cache-Control no-store
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Content-Security-Policy "sandbox; default-src 'none'; media-src 'self'"
    # http-response set-header Access-Control-Allow-Origin "https://cloud.example.org"
    # http-response set-header Access-Control-Expose-Headers "icy-metaint"
    server slay3 relay3.slayradio.org:8000

# Timeouts: `timeout server` and `timeout client` are inactivity timers and a
# stream is never inactive, so ordinary values are fine. Icecast answers
# HTTP/1.0 with "Connection: Close" and no length; HAProxy streams it until the
# origin closes, over HTTP/1.1 and HTTP/2 alike. The browser's own
# User-Agent may be forwarded as is; Icecast serves audio to anyone.
#
# Then add the station in Radio by its own address:
#     http://relay4.slayradio.org:8000/
#   with the backup server:
#     http://relay3.slayradio.org:8000/
#   and homepage https://slay.radio/
# With the `relays` lines above in the app's configuration, it plays from here.
#
# Check the relay first. You want an audio content-type, not text/html:
#     curl -sI https://cloud.example.org/radio-relay/slay4
#
# Relayed under the cloud's own hostname the stream is same-origin, so the
# spectrum is analysed rather than indicative, and track titles are read from
# the stream through the relay (Icy-MetaData passes through; deploy/relay-test
# checks it). Under a hostname of its own, both need the three commented CORS
# lines, uncommented in every relay backend, and titles also need the relay
# hostname allowed in the cloud's `connect-src` (deploy/csp.yaml). Either way
# the app asks no status page of a relay it knows from its `relays` setting —
# a relay re-serves one path — and needs the stream listed there to know the
# relay is there.
